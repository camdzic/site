pre-commit:
  piped: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,cjs,mjs,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    build:
      glob: "*.{ts,tsx}"
      run: bun run build